# Royal Martinot — carte mémoire MMC3 (TGROM : CHR-RAM) : 512 Ko PRG (32 banques de 16 Ko, version 2.67 ; 256 Ko avant),
# 8 Ko de CHR-RAM, 8 Ko de PRG-RAM ($6000-$7FFF, sauvegardée si pile).
# MMC3 : la dernière banque est fixe en $C000-$FFFF (« PRGF », deux blocs de 8 Ko) ; banques 0 à 30 de 16 Ko commutables en $8000 (deux blocs de 8 Ko, R6 et R7).
# Chaque banque se termine par un petit programme (STUBn), hérité du MMC1 et
# inerte ; l'amorçage MMC3 (segment BOOT) est dans les 8 derniers Ko.
SYMBOLS {
    __STACKSIZE__: type = weak, value = $0100;
}
MEMORY {
    ZP:     file = "", start = $0010, size = $00F0, type = rw, define = yes;
    HEADER: file = %O, start = $0000, size = $0010, fill = yes;
    OAMRAM: file = "", start = $0200, size = $0100;
    BUFRAM: file = "", start = $0300, size = $0100;
    RAM:    file = "", start = $0400, size = $0300, define = yes;
    CSTACK: file = "", start = $0700, size = __STACKSIZE__, define = yes;
    WRAM:   file = "", start = $6000, size = $1800, define = yes;
    SAVE:   file = "", start = $7800, size = $0800, define = yes;
    PRG0:   file = %O, start = $8000, size = $3FF0, fill = yes;
    STB0:   file = %O, start = $FFF0, size = $0010, fill = yes;
