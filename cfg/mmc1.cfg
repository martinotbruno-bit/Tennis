# Royal Martinot — carte mémoire MMC1 (SNROM) : 256 Ko PRG (16 banques de 16 Ko),
# 8 Ko de CHR-RAM, 8 Ko de PRG-RAM ($6000-$7FFF, sauvegardée si pile).
# Banque 15 fixe en $C000 (« PRGF ») ; banques 0 à 14 commutables en $8000.
# Chaque banque se termine par un petit programme de démarrage (STUBn) :
# au démarrage, n'importe quelle banque peut se trouver en $C000.
SYMBOLS {
    __STACKSIZE__: type = weak, value = $0100;
}
MEMORY {
    ZP:     file = "", start = $0010, size = $00F0, type = rw, define = yes;
    HEADER: file = %O, start = $0000, size = $0010, fill = yes;
    OAMRAM: file = "", start = $0200, size = $0100;
    BUFRAM: file = "", start = $0300, size = $0100;
    RAM:    file = "", start = $0400, size = $0300, define = yes;
    CSTACK: file = "", start = $0700, size = __STACKSIZE__, define = yes;
    WRAM:   file = "", start = $6000, size = $1800, define = yes;
    SAVE:   file = "", start = $7800, size = $0800, define = yes;
    PRG0:   file = %O, start = $8000, size = $3FF0, fill = yes;
    STB0:   file = %O, start = $FFF0, size = $0010, fill = yes;
    PRG1:   file = %O, start = $8000, size = $3FF0, fill = yes;
    STB1:   file = %O, start = $FFF0, size = $0010, fill = yes;
    PRG2:   file = %O, start = $8000, size = $3FF0, fill = yes;
    STB2:   file = %O, start = $FFF0, size = $0010, fill = yes;
    PRG3:   file = %O, start = $8000, size = $3FF0, fill = yes;
    STB3:   file = %O, start = $FFF0, size = $0010, fill = yes;
    PRG4:   file = %O, start = $8000, size = $3FF0, fill = yes;
    STB4:   file = %O, start = $FFF0, size = $0010, fill = yes;
    PRG5:   file = %O, start = $8000, size = $3FF0, fill = yes;
    STB5:   file = %O, start = $FFF0, size = $0010, fill = yes;
    PRG6:   file = %O, start = $8000, size = $3FF0, fill = yes;
    STB6:   file = %O, start = $FFF0, size = $0010, fill = yes;
    PRG7:   file = %O, start = $8000, size = $3FF0, fill = yes;
    STB7:   file = %O, start = $FFF0, size = $0010, fill = yes;
    PRG8:   file = %O, start = $8000, size = $3FF0, fill = yes;
    STB8:   file = %O, start = $FFF0, size = $0010, fill = yes;
    PRG9:   file = %O, start = $8000, size = $3FF0, fill = yes;
    STB9:   file = %O, start = $FFF0, size = $0010, fill = yes;
    PRG10:   file = %O, start = $8000, size = $3FF0, fill = yes;
    STB10:   file = %O, start = $FFF0, size = $0010, fill = yes;
    PRG11:   file = %O, start = $8000, size = $3FF0, fill = yes;
    STB11:   file = %O, start = $FFF0, size = $0010, fill = yes;
    PRG12:   file = %O, start = $8000, size = $3FF0, fill = yes;
    STB12:   file = %O, start = $FFF0, size = $0010, fill = yes;
    PRG13:   file = %O, start = $8000, size = $3FF0, fill = yes;
    STB13:   file = %O, start = $FFF0, size = $0010, fill = yes;
    PRG14:   file = %O, start = $8000, size = $3FF0, fill = yes;
    STB14:   file = %O, start = $FFF0, size = $0010, fill = yes;
    PRGF:   file = %O, start = $C000, size = $3FF0, fill = yes, define = yes;
    STBF:   file = %O, start = $FFF0, size = $0010, fill = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    HEADER:   load = HEADER, type = ro;
    OAM:      load = OAMRAM, type = bss, define = yes;
    VRAMBUF:  load = BUFRAM, type = bss, define = yes;
    BSS:      load = RAM,    type = bss, define = yes;
    WBSS:     load = WRAM,   type = bss, define = yes;
    SAVEDATA: load = SAVE,   type = bss, define = yes;
    BANK0:    load = PRG0,   type = ro,  define = yes;
    RODATA0:  load = PRG0,   type = ro,  optional = yes;
    BANK1:    load = PRG1,   type = ro,  define = yes;
    RODATA1:  load = PRG1,   type = ro,  optional = yes;
    BANK2:    load = PRG2,   type = ro,  define = yes;
    RODATA2:  load = PRG2,   type = ro,  optional = yes;
    BANK3:    load = PRG3,   type = ro,  define = yes, optional = yes;
    RODATA3:  load = PRG3,   type = ro,  optional = yes;
    BANK4:    load = PRG4,   type = ro,  define = yes, optional = yes;
    RODATA4:  load = PRG4,   type = ro,  optional = yes;
    BANK5:    load = PRG5,   type = ro,  define = yes, optional = yes;
    RODATA5:  load = PRG5,   type = ro,  optional = yes;
    BANK6:    load = PRG6,   type = ro,  define = yes, optional = yes;
    RODATA6:  load = PRG6,   type = ro,  optional = yes;
    BANK7:    load = PRG7,   type = ro,  define = yes, optional = yes;
    RODATA7:  load = PRG7,   type = ro,  optional = yes;
    BANK8:    load = PRG8,   type = ro,  define = yes, optional = yes;
    RODATA8:  load = PRG8,   type = ro,  optional = yes;
    BANK9:    load = PRG9,   type = ro,  define = yes, optional = yes;
    RODATA9:  load = PRG9,   type = ro,  optional = yes;
    BANK10:    load = PRG10,   type = ro,  define = yes, optional = yes;
    RODATA10:  load = PRG10,   type = ro,  optional = yes;
    BANK11:    load = PRG11,   type = ro,  define = yes, optional = yes;
    RODATA11:  load = PRG11,   type = ro,  optional = yes;
    BANK12:    load = PRG12,   type = ro,  define = yes, optional = yes;
    RODATA12:  load = PRG12,   type = ro,  optional = yes;
    BANK13:    load = PRG13,   type = ro,  define = yes, optional = yes;
    RODATA13:  load = PRG13,   type = ro,  optional = yes;
    BANK14:    load = PRG14,   type = ro,  define = yes, optional = yes;
    RODATA14:  load = PRG14,   type = ro,  optional = yes;
    STUB0:    load = STB0,   type = ro;
    STUB1:    load = STB1,   type = ro;
    STUB2:    load = STB2,   type = ro;
    STUB3:    load = STB3,   type = ro;
    STUB4:    load = STB4,   type = ro;
    STUB5:    load = STB5,   type = ro;
    STUB6:    load = STB6,   type = ro;
    STUB7:    load = STB7,   type = ro;
    STUB8:    load = STB8,   type = ro;
    STUB9:    load = STB9,   type = ro;
    STUB10:    load = STB10,   type = ro;
    STUB11:    load = STB11,   type = ro;
    STUB12:    load = STB12,   type = ro;
    STUB13:    load = STB13,   type = ro;
    STUB14:    load = STB14,   type = ro;
    STARTUP:  load = PRGF,   type = ro,  define = yes;
    LOWCODE:  load = PRGF,   type = ro,  optional = yes;
    ONCE:     load = PRGF,   type = ro,  optional = yes;
    CODE:     load = PRGF,   type = ro,  define = yes;
    RODATA:   load = PRGF,   type = ro,  define = yes;
    DPCM:     load = PRGF,   type = ro,  align = $40, optional = yes;   # échantillons (le DMC lit $C000-$FFFF)
    DATA:     load = PRGF, run = RAM, type = rw, define = yes;
    STUBF:    load = STBF,   type = ro;
}
FEATURES {
    CONDES: type = constructor, label = __CONSTRUCTOR_TABLE__, count = __CONSTRUCTOR_COUNT__, segment = ONCE;
    CONDES: type = destructor,  label = __DESTRUCTOR_TABLE__,  count = __DESTRUCTOR_COUNT__,  segment = RODATA;
    CONDES: type = interruptor, label = __INTERRUPTOR_TABLE__, count = __INTERRUPTOR_COUNT__, segment = RODATA, import = __CALLIRQ__;
}
